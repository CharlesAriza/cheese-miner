<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1622" />
    <title>Cheese Miner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="res" id="res-coins" title="Coins"><i class="ico coin"></i><b id="coins">0</b></div>
        <div class="res" id="res-raw" title="Raw Cheese"><i class="ico raw"></i><b id="raw">0</b></div>
        <div class="res" id="res-base" title="Cheese Base"><i class="ico base"></i><b id="base">0</b></div>
        <div class="res" id="res-lots" title="Cheese lots"><i class="ico lot"></i><b id="lots">0</b></div>
      </header>

      <section class="objective">
        <div class="obj-row"><span id="obj-text"></span><span id="obj-num"></span></div>
        <div class="bar" id="obj-bar"><i id="obj-fill"></i></div>
      </section>

      <main class="stage" id="stage">
        <canvas id="scene"></canvas>
        <div id="floaters"></div>
        <div id="combo"></div>
        <div id="devflag"></div>
        <div id="banner"></div>
        <div id="toast"></div>
      </main>

      <footer class="controls">
        <div class="actions">
          <button class="act" id="btn-refine"><i class="fill"></i><b>REFINE</b><small></small></button>
          <button class="act big" id="btn-mine"><i class="fill"></i><b>MINE</b><small></small></button>
          <button class="act" id="btn-drill"><i class="fill"></i><b>DRILL</b><small></small></button>
        </div>
        <nav class="tools">
          <button data-panel="build">BUILD<i class="dot"></i></button>
          <button data-panel="workers">WORKERS<i class="dot"></i></button>
          <button data-panel="cheese">CHEESE<i class="dot"></i></button>
          <button data-panel="market">MARKET<i class="dot"></i></button>
          <button data-panel="options" class="gear">OPT</button>
        </nav>
      </footer>

      <div class="overlay" id="sheet" hidden>
        <div class="panel">
          <div class="phead">
            <h2 id="sheet-title"></h2>
            <button class="close" data-act="close">CLOSE</button>
          </div>
          <div id="sheet-body"></div>
        </div>
      </div>

      <div class="overlay center" id="modal" hidden>
        <div class="panel" id="modal-body"></div>
      </div>
    </div>

    <script src="js/game/config/balance.js"></script>
    <script src="js/playtest/telemetry.js"></script>
    <script src="js/game/state.js"></script>
    <script src="js/game/systems/production.js"></script>
    <script src="js/game/systems/colony.js"></script>
    <script src="js/game/systems/cheesery.js"></script>
    <script src="js/game/systems/merchant.js"></script>
    <script src="js/game/simulation.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/playtest/devtools.js"></script>
    <script src="js/ui/sfx.js"></script>
    <script src="js/ui/scene.js"></script>
    <script src="js/ui/panels.js"></script>
    <script src="js/ui/main.js"></script>
  </body>
</html>
