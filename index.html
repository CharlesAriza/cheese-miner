<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1622" />
    <title>Cheese Miner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <link rel="stylesheet" href="style.css?v=1791802224" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="res" id="res-coins"><img class="pix" id="ic-coins" alt="" /><div><span>COINS</span><b id="coins">0</b><em id="rate-coins"></em></div></div>
        <!-- Los tres contadores del queso que se está mirando, con su nombre una sola vez. -->
        <div class="lanegroup" id="lanegroup">
          <span id="lane-name"></span>
          <div class="lanecells">
            <div class="res" id="res-raw"><img class="pix" id="ic-raw" alt="" /><div><b id="raw">0</b><em id="rate-raw"></em></div></div>
            <div class="res" id="res-base"><img class="pix" id="ic-base" alt="" /><div><b id="base">0</b><em id="rate-base"></em></div></div>
            <div class="res" id="res-lots"><img class="pix" id="ic-lots" alt="" /><div><b id="lots">0</b><em id="rate-lots"></em></div></div>
          </div>
        </div>
      </header>

      <section class="objective" id="objective">
        <div class="obj-row"><span id="obj-text"></span><span id="obj-num"></span></div>
        <div class="bar" id="obj-bar"><i id="obj-fill"></i></div>
      </section>

      <main class="stage" id="stage">
        <canvas id="scene"></canvas>
        <div id="bubbles"></div>
        <div id="floaters"></div>
        <div id="combo"><span></span><i><i></i></i></div>
        <div id="devflag"></div>
        <div id="banner"></div>
        <div id="toast"></div>
      </main>

      <footer class="controls">
        <!-- La cadena de producción: cada casilla es una estación que se puede tocar. -->
        <nav class="chain" id="chain">
          <button class="tile" data-st="rock"><img class="pix" alt="" /><b>MINE</b><u></u><i class="mini"><i></i></i><em></em></button>
          <button class="tile" data-st="drill"><img class="pix" alt="" /><b>DRILL</b><u></u><i class="mini"><i></i></i><em></em></button>
          <button class="tile" data-st="refinery"><img class="pix" alt="" /><b>REFINE</b><u></u><i class="mini"><i></i></i><em></em></button>
          <button class="tile" data-st="cheesery"><img class="pix" alt="" /><b>CHEESE</b><u></u><i class="mini"><i></i></i><em></em></button>
          <button class="tile" data-st="shop"><img class="pix" alt="" /><b>SELL</b><u></u><i class="mini"><i></i></i><em></em></button>
        </nav>
        <section class="dock">
          <div class="dhead">
            <div class="dtitle"><b id="dock-title"></b><span id="dock-xpnum"></span></div>
            <div class="bar xp"><i id="dock-xp"></i></div>
            <small id="dock-status"></small>
          </div>
          <div id="dock-zones"></div>
          <div class="drow">
            <button class="act big" id="dock-main"><i class="fill"></i><b></b><small></small></button>
            <div id="dock-side"></div>
          </div>
        </section>
        <nav class="tools">
          <button id="nav-colony">COLONY<i class="dot"></i></button>
          <button id="nav-mice">MICE<i class="dot"></i></button>
          <button id="nav-all">BUY ALL</button>
          <button id="nav-menu" class="gear">MENU</button>
        </nav>
      </footer>

      <div id="flyers"></div>

      <div class="overlay" id="sheet" hidden>
        <div class="panel">
          <div class="phead">
            <h2 id="sheet-title"></h2>
            <button class="close" data-act="close">CLOSE</button>
          </div>
          <div id="sheet-body"></div>
        </div>
      </div>

      <div class="overlay center" id="modal" hidden>
        <div class="panel" id="modal-body"></div>
      </div>
    </div>

    <script src="js/game/config/balance.js?v=1791802224"></script>
    <script src="js/game/config/traits.js?v=1791802224"></script>
    <script src="js/playtest/telemetry.js?v=1791802224"></script>
    <script src="js/game/state.js?v=1791802224"></script>
    <script src="js/game/systems/skills.js?v=1791802224"></script>
    <script src="js/game/systems/mice.js?v=1791802224"></script>
    <script src="js/game/systems/production.js?v=1791802224"></script>
    <script src="js/game/systems/cheesery.js?v=1791802224"></script>
    <script src="js/game/simulation.js?v=1791802224"></script>
    <script src="js/storage.js?v=1791802224"></script>
    <script src="js/playtest/devtools.js?v=1791802224"></script>
    <script src="js/ui/sfx.js?v=1791802224"></script>
    <script src="js/ui/icons.js?v=1791802224"></script>
    <script src="js/ui/scene.js?v=1791802224"></script>
    <script src="js/ui/panels.js?v=1791802224"></script>
    <script src="js/ui/main.js?v=1791802224"></script>
  </body>
</html>
