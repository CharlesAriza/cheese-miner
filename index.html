<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1622" />
    <title>Cheese Miner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <link rel="stylesheet" href="style.css?v=1792023272" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="res" id="res-coins"><img class="pix" id="ic-coins" alt="" /><div><span>COINS</span><b id="coins">0</b><em id="rate-coins"></em></div></div>
        <!-- La tienda es una para todas las rocas: el queso en el mostrador, lo que vende y lo ocupada que va. -->
        <button class="hshop" id="res-shop"><img class="pix" id="ic-shop" alt="" /><div><span>SHOP · ALL ROCKS</span><b id="shop-stock">0</b><em id="shop-rate"></em></div><i class="hbar"><i id="shop-fill"></i></i></button>
      </header>

      <section class="objective" id="objective" role="button" tabindex="0">
        <div class="obj-row"><span id="obj-text"></span><span id="obj-num"></span></div>
        <div class="bar" id="obj-bar"><i id="obj-fill"></i></div>
      </section>

      <main class="stage" id="stage">
        <canvas id="scene"></canvas>
        <!-- La roca que se mira, de izquierda a derecha como su cadena: lo que hay y cómo fluye.
             V4.10: cada casilla dice qué es (RAW → BASE → CHEESE), luego cuánto y su estado. -->
        <div class="flowband" id="flowband">
          <div class="fchip" id="res-raw"><img class="pix" id="ic-raw" alt="" /><div><small class="fname">RAW</small><b id="raw">0</b><em id="rate-raw"></em></div></div>
          <i class="farrow"></i>
          <div class="fchip" id="res-base"><img class="pix" id="ic-base" alt="" /><div><small class="fname">BASE</small><b id="base">0</b><em id="rate-base"></em></div></div>
          <i class="farrow"></i>
          <div class="fchip" id="res-lots"><img class="pix" id="ic-lots" alt="" /><div><small class="fname">CHEESE</small><b id="lots">0</b><em id="rate-lots"></em></div></div>
        </div>
        <div id="bubbles"></div>
        <div id="floaters"></div>
        <div id="combo"><span></span><i><i></i></i></div>
        <div id="devflag"></div>
        <div id="banner"></div>
        <div id="toast"></div>
      </main>

      <footer class="controls">
        <!-- La cadena de producción: cada casilla es una estación que se puede tocar. -->
        <nav class="chain" id="chain">
          <button class="tile" data-st="rock"><img class="pix" alt="" /><b>MINE</b><u></u><i class="mini"><i></i></i><em></em></button>
          <button class="tile" data-st="drill"><img class="pix" alt="" /><b>DRILL</b><u></u><i class="mini"><i></i></i><em></em></button>
          <button class="tile" data-st="refinery"><img class="pix" alt="" /><b>REFINE</b><u></u><i class="mini"><i></i></i><em></em></button>
          <button class="tile" data-st="cheesery"><img class="pix" alt="" /><b>CHEESE</b><u></u><i class="mini"><i></i></i><em></em></button>
          <button class="tile" data-st="shop"><img class="pix" alt="" /><b>SELL</b><u></u><i class="mini"><i></i></i><em></em></button>
          <button class="tile labtile" data-st="lab" hidden><img class="pix" alt="" /><b>LAB</b><u></u><i class="mini"><i></i></i><em></em></button>
        </nav>
        <section class="dock">
          <!-- Qué roca se mira: una ficha igual por roca. Solo aparece con dos o más. -->
          <div class="rockstrip" id="dock-rocks" hidden></div>
          <div class="dhead">
            <div class="dtitle"><b id="dock-title"></b><span id="dock-xpnum"></span></div>
            <div class="bar xp"><i id="dock-xp"></i></div>
            <!-- Dos renglones de alto fijo: qué hace esta etapa y cómo va la línea de la roca. -->
            <div class="dinfo" id="dock-info"><small id="dock-status"></small><small id="dock-why"></small></div>
          </div>
          <div class="drow">
            <!-- V4.8: la cartela del refuerzo va DENTRO del botón, en su propia columna a la izquierda: nunca tapa el texto. -->
            <button class="act big" id="dock-main"><i class="fill"></i><i class="dboost" id="dock-boost"></i><b></b><small></small></button>
            <div id="dock-side" hidden>
              <button class="dwork" id="dock-worker"><img class="pix" alt="" /><span><b></b><u></u></span></button>
              <button class="dbook" id="dock-book" hidden>RECIPES</button>
            </div>
          </div>
          <!-- Mejoras: la más barata de esta habilidad, su árbol y comprar todo lo que alcance. -->
          <div class="dups">
            <button class="dup quick" id="up-quick"><b></b><span><img class="pix" alt="" /><u></u></span></button>
            <button class="dup" id="up-tree"><b>UPGRADES</b><u></u></button>
            <button class="dup all" id="up-all"><b>BUY ALL</b><u></u></button>
          </div>
        </section>
        <nav class="tools">
          <button id="nav-colony">COLONY<i class="dot"></i></button>
          <button id="nav-mice">MICE <small id="nav-mice-n"></small><i class="dot"></i></button>
          <button id="nav-boosts" hidden>BOOSTS<i class="dot"></i></button>
          <button id="nav-menu" class="gear">MENU</button>
        </nav>
      </footer>

      <div id="flyers"></div>

      <div class="overlay" id="sheet" hidden>
        <div class="panel">
          <div class="phead">
            <h2 id="sheet-title"></h2>
            <button class="close" data-act="close">CLOSE</button>
          </div>
          <!-- V4: aviso de lo que cambia al mover ratones. Va encima del panel, no tapa los puestos. -->
          <div id="mcx-fx" class="mcx-fx" hidden></div>
          <div id="sheet-body"></div>
        </div>
      </div>

      <div class="overlay center" id="modal" hidden>
        <div class="panel" id="modal-body"></div>
      </div>
    </div>

    <!-- PROTOTIPO: guarda en su propia clave (la primera vez copia la partida normal, sin tocarla). -->
    <script>
      window.CM = window.CM || {};
      CM.SAVE_KEY = 'cheese-miner-proto';
      try {
        if (!localStorage.getItem(CM.SAVE_KEY) && localStorage.getItem('cheese-miner-v3')) localStorage.setItem(CM.SAVE_KEY, localStorage.getItem('cheese-miner-v3'));
      } catch (e) {}
    </script>
    <script src="js/game/config/balance.js?v=1792023272"></script>
    <script src="js/game/config/traits.js?v=1792023272"></script>
    <script src="js/playtest/telemetry.js?v=1792023272"></script>
    <script src="js/game/state.js?v=1792023272"></script>
    <script src="js/game/systems/skills.js?v=1792023272"></script>
    <script src="js/game/systems/mice.js?v=1792023272"></script>
    <script src="js/game/systems/production.js?v=1792023272"></script>
    <script src="js/game/systems/cheesery.js?v=1792023272"></script>
    <script src="js/game/simulation.js?v=1792023272"></script>
    <script src="js/storage.js?v=1792023272"></script>
    <script src="js/playtest/devtools.js?v=1792023272"></script>
    <script src="js/ui/sfx.js?v=1792023272"></script>
    <script src="js/ui/icons.js?v=1792023272"></script>
    <script src="js/ui/scene.js?v=1792023272"></script>
    <script src="js/ui/panels.js?v=1792023272"></script>
    <script src="js/ui/main.js?v=1792023272"></script>
  </body>
</html>
