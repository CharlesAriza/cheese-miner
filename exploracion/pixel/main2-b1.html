<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Main 2.0 Surface</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* MICE · COLONY en Pulido+. Concepto: cada roca es una cuadrilla; sus puestos son nichos donde el
   ratón está de pie, de cuerpo entero, delante de la pared de su roca. Rareza = marco del nicho;
   rango = ropa del ratón + insignia. Mismo kit que MAIN (caja, color con función, letra 8/12/16). */
:root {
  color-scheme: dark;
  --bg: #120f18; --text: #ffffff; --soft: #d6d0e6; --muted: #9f97b8;
  --gold: #ffcf2e; --gold-d: #b8860b; --new: #62d36e; --up: #62d36e; --rare: #5a9cf0; --rare-d: #2b5cab;
  --bed: #ff8fb4; --bed-d: #6a2a44; --train: #b58cff; --train-d: #3a2a66; --rate: #a9cfb0;
  --p1: #3d3352; --p2: #2a2338; --p3: #1d1828; --p4: #0c0910;
  --pixel: 'Press Start 2P', ui-monospace, Menlo, monospace;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 20px 16px 40px; background: var(--bg); color: var(--text); font-family: var(--sans); }
.wrap { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 28px; }
.col { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
.lead { margin: 0 0 4px; max-width: 62ch; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
.lead b { color: var(--gold); font-family: var(--pixel); font-size: 12px; font-weight: 400; }
.fit { width: 375px; max-width: 100%; }
.phone { width: 375px; height: 812px; position: relative; overflow: hidden; background: #1b1622; border-radius: 26px;
  box-shadow: 0 0 0 6px #2a2338, 0 0 0 8px #0c0910, 0 24px 60px #000a; transform-origin: top left; }
.pix { image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; image-rendering: pixelated; display: block; }
canvas { image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; image-rendering: pixelated; }

/* Caja única del kit. */
.box { background: var(--p2); border: 2px solid var(--p4); box-shadow: inset 0 2px 0 var(--p1), inset 0 -3px 0 var(--p3);
  clip-path: polygon(2px 0, calc(100% - 2px) 0, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 0 calc(100% - 2px), 0 2px); }
.box.sel { border-color: var(--gold); }
.nm { font-family: var(--pixel); font-size: 8px; line-height: 8px; color: var(--soft); }
.v2 { font-family: var(--pixel); font-size: 12px; line-height: 12px; color: var(--text); }
.meta { font-size: 10px; line-height: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }

/* Botón pequeño de acción: misma caja, más relieve; se reconoce como tocable. */
.act { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 26px; min-width: 26px; padding: 0 8px 2px; flex: none;
  background: var(--p1); border: 2px solid var(--p4); box-shadow: inset 0 2px 0 #54486c, inset 0 -3px 0 var(--p3);
  font-family: var(--pixel); font-size: 8px; color: var(--soft); cursor: pointer;
  clip-path: polygon(2px 0, calc(100% - 2px) 0, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 0 calc(100% - 2px), 0 2px); }
.act:active { transform: translateY(1px); box-shadow: inset 0 1px 0 #54486c, inset 0 -1px 0 var(--p3); }
.act canvas { image-rendering: pixelated; }
/* Pantalla principal de fondo, oscurecida. */
#behind { position: absolute; left: 0; top: -62px; width: 375px; height: 316px; image-rendering: pixelated; }
.dim { position: absolute; inset: 0; background: #0c0910b0; }

/* Hoja del panel (y 195 → final, como el juego). */
.sheet { position: absolute; left: 0; top: 118px; width: 375px; height: 694px; background: var(--p3); border-top: 2px solid var(--p4);
  box-shadow: inset 0 2px 0 var(--p1); display: flex; flex-direction: column; padding: 8px 8px 0; gap: 8px; }
.shead { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 2px; }
.shead .ttl { display: flex; align-items: flex-start; gap: 8px; height: 26px; }
.shead .ttl b { margin-top: 6px; }
.shead .ttl b { font-family: var(--pixel); font-size: 16px; font-weight: 400; }
.close { height: 30px; padding: 0 12px 2px; display: flex; align-items: center; }
.tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; height: 36px; flex: none; }
.tab { display: flex; align-items: center; justify-content: center; gap: 6px; padding-bottom: 2px; }
.tab .nm { color: var(--muted); }
.tab.sel .nm { color: var(--text); }
.tab .meta { font-size: 10px; }
.tab .badge { min-width: 14px; height: 14px; display: grid; place-items: center; padding: 0 3px 1px; font-family: var(--pixel); font-size: 8px; color: #10240f;
  background: var(--up); border: 1px solid var(--p4); box-shadow: inset 0 1px 0 #b8ffb0, inset 0 -2px 0 #2f8f44; }
.sbody { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 12px; padding: 0 0 14px; scrollbar-width: none; }
.sbody::-webkit-scrollbar { display: none; }

/* Estado de la plantilla y avisos. */
.status { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
.status b { font-family: var(--pixel); font-size: 8px; font-weight: 400; color: var(--soft); }
.status .ok { color: var(--muted); }
.notes { display: flex; flex-wrap: wrap; gap: 6px; }
.note { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 2px 7px; font-size: 12px; font-weight: 600; color: var(--soft); cursor: pointer; }
.note b { font-family: var(--pixel); font-size: 8px; font-weight: 400; }
.note .go { opacity: .7; margin-left: 2px; }
.note.up { border-color: #2f6a34; } .note.up b { color: var(--up); }
.note.bed { border-color: var(--bed-d); } .note.bed b { color: var(--bed); }
.note.free { border-style: dashed; border-color: #6a5f88; } .note.free b { color: var(--text); }
/* Contratar: la misma rejilla en sus tres estados (icono, texto, botón de 96 px). */
.hire { display: grid; grid-template-columns: 40px minmax(0, 1fr) 96px; align-items: center; column-gap: 10px; min-height: 64px; padding: 8px 8px 9px 10px; }
.hire .who { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hire .who b { font-family: var(--pixel); font-size: 8px; line-height: 8px; font-weight: 400; color: var(--text); }
.hire .who span { font-size: 12px; color: var(--muted); line-height: 15px; }
.price { display: flex; align-items: center; justify-content: center; gap: 6px; width: 96px; height: 40px; padding-bottom: 2px; font-family: var(--pixel); font-size: 8px; color: var(--gold); }
.price img { width: 21px; height: 21px; }
.price.short { color: var(--muted); } .price.short img { filter: grayscale(1) brightness(.8); }
.price.go { background: #ff8a2e; color: #fff; text-shadow: 1px 1px 0 #7a2a10; border-color: #2b1d12; box-shadow: inset 0 2px 0 #ffe0a0, inset 0 -4px 0 #d9581f; }
/* Grupo (roca o colonia entera). */
.grp { display: flex; flex-direction: column; gap: 6px; }
.ghead { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; column-gap: 8px; height: 44px; padding: 0 8px 2px; cursor: pointer; }
.ghead .t { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.ghead .t b { font-family: var(--pixel); font-size: 8px; line-height: 8px; font-weight: 400; color: var(--text); white-space: nowrap; }
.ghead .t span { font-size: 10px; line-height: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--soft); }
.ghead .t span i { font-style: normal; color: var(--muted); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 11px; }
.ghead .right { display: flex; align-items: center; gap: 6px; }
.ghead .faces { display: flex; gap: 3px; }
.grp[data-zone] .ghead { background: var(--zw); box-shadow: inset 0 2px 0 var(--zl), inset 0 -3px 0 var(--zd); }
.crew { position: relative; display: grid; gap: 6px; }
.grp { gap: 6px; }
.crew.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.crew.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.crew.c2 .post { height: 152px; padding: 6px 8px 8px; gap: 6px; }
.crew.c2 .post .stage { height: 70px; }
.crew.c2 .post .line { gap: 10px; }
/* Combos: 1) cuántos, 2) qué ganan los cuatro de la roca, 3) cuántos más hay entre vecinos.
   DETAILS abre el desglose con el origen de cada uno. El beneficio va en oro (es premio). */
.combos { display: flex; flex-direction: column; gap: 0; padding: 0; }
.cmb-sum { display: grid; grid-template-columns: 46px minmax(0, 1fr); align-items: center; column-gap: 10px; padding: 8px 6px 8px 8px; }
.cmb-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cmb-n { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cmb-n b { font-family: var(--pixel); font-size: 16px; line-height: 16px; font-weight: 400; color: var(--gold); text-shadow: 2px 2px 0 var(--p4); }
.cmb-n span { font-size: 9px; line-height: 10px; font-weight: 800; letter-spacing: .5px; color: var(--muted); }
.cmb-gain { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.cmb-gain .lbl { font-size: 9px; line-height: 10px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--soft); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 6px 1px; font-size: 12px; font-weight: 800; color: var(--gold); white-space: nowrap;
  background: #33280f; border: 1px solid #8a6a12; box-shadow: inset 0 1px 0 #5a4818; }
.chip.off { color: var(--muted); background: #241f2e; border: 1px dashed #6a5f88; box-shadow: none; font-weight: 700; font-size: 11px; }
.cmb-pairs { display: flex; align-items: center; gap: 5px; font-size: 11px; line-height: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.cmb-pairs canvas { flex: none; image-rendering: pixelated; }
.cmb-pairs b { color: var(--soft); font-weight: 800; }
.combos .act { height: 30px; padding: 0 8px 2px; }
.cmb-list { display: none; flex-direction: column; gap: 6px; padding: 2px 8px 10px; }
.combos.open .cmb-list { display: flex; }
.cmb-h { font-size: 9px; line-height: 10px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); padding: 6px 0 0; border-top: 1px solid var(--p1); }
.cmb-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; column-gap: 8px; min-height: 34px; }
.cmb-row .who { display: flex; gap: 2px; justify-content: center; }
.cmb-row .who .mini { width: 22px; height: 22px; border-width: 1px; }
.cmb-row .who .mini canvas { width: 18px; height: 16px; }
.cmb-row .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cmb-row .t b { font-size: 12px; line-height: 14px; font-weight: 800; color: var(--text); }
.cmb-row .t span { font-size: 11px; line-height: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* El nicho de un puesto. Orden de lectura: estado (franja de color arriba, si lo hay), nombre,
   rendimiento (cifra) y nivel. Mismas medidas en todos: 126 px de alto. */
.post { position: relative; display: flex; flex-direction: column; padding: 5px 5px 7px; gap: 5px; cursor: pointer; min-width: 0; height: 126px; }
.post .job { display: flex; align-items: center; justify-content: center; gap: 4px; height: 12px; }
.post .job .meta { font-size: 9px; line-height: 10px; }
.post .job img { height: 12px; width: auto; }
.post .stage { position: relative; flex: none; height: 58px; overflow: hidden; background: var(--zw2, #2a2433);
  box-shadow: inset 0 2px 0 #0003, inset 0 -6px 0 var(--floor, #5c3a24), inset 0 -7px 0 var(--floorl, #8b5a2b); }
.post .stage .emb { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); opacity: .16; filter: grayscale(.6); }
.post .stage canvas.m { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); width: 44px; height: 40px; image-rendering: pixelated; }
.post .band { position: absolute; left: 0; right: 0; top: 0; height: 13px; display: flex; align-items: center; justify-content: center; gap: 3px;
  font-size: 9px; line-height: 9px; font-weight: 800; letter-spacing: 0; white-space: nowrap; color: #fff; }
.post .band canvas { image-rendering: pixelated; }
.post .name { display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 13px; line-height: 15px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; }
.post .line { display: flex; align-items: baseline; justify-content: center; gap: 6px; white-space: nowrap; }
.post .out { font-family: var(--pixel); font-size: 8px; line-height: 8px; color: var(--text); }
.post .lv { font-size: 9px; line-height: 10px; font-weight: 700; letter-spacing: .4px; color: var(--muted); }
.post .lv canvas { display: inline-block; image-rendering: pixelated; vertical-align: -2px; margin-right: 4px; }
.crew.c4 .post .rn, .sgrid .post .rn, .crew.c4 .post .lv canvas, .sgrid .post .lv canvas { display: none; }
/* Rareza: el marco del nicho. */
.post.r1 { border-color: var(--rare-d); box-shadow: inset 0 0 0 2px var(--rare), inset 0 -3px 0 var(--p3); }
.post.r2 { border-color: var(--gold-d); box-shadow: inset 0 0 0 2px var(--gold), inset 0 -3px 0 var(--p3); }
.post.r2 .stage { background: radial-gradient(circle at 50% 70%, #ffcf2e30 0 22px, transparent 23px), var(--zw2, #2a2433); }
.spark { position: absolute; width: 3px; height: 3px; background: #fff3a0; box-shadow: 0 0 0 1px #c98a08; animation: twinkle 1.6s steps(4) infinite; pointer-events: none; }
@keyframes twinkle { 0%, 60%, 100% { opacity: 0 } 70%, 90% { opacity: 1 } }
/* Estados: color fijo en el marco y en la franja. Verde ascender, rosa cama, violeta entrenar. */
.post.due { border-color: #2f6a34; box-shadow: inset 0 0 0 2px var(--up), inset 0 -3px 0 var(--p3); }
.post.due .band { background: #1f5a28; color: #c8ffc0; }
.post.bed { border-color: var(--bed-d); box-shadow: inset 0 0 0 2px var(--bed), inset 0 -3px 0 var(--p3); }
.post.bed .stage { background: linear-gradient(#3a1e2c, #2a1622); }
.post.bed .band { background: #8a2f58; color: #ffe0ec; }
.post.train { border-color: var(--train-d); box-shadow: inset 0 0 0 2px var(--train), inset 0 -3px 0 var(--p3); }
.post.train .stage { background: linear-gradient(#2a2244, #1e1834); }
.post.train .band { background: #5a3aa8; color: #efe6ff; }
.zz { position: absolute; font-family: var(--pixel); font-size: 8px; color: #bfe8fd; animation: zz 2s steps(4) infinite; }
@keyframes zz { 0% { transform: translate(0, 0); opacity: 0 } 25% { opacity: 1 } 100% { transform: translate(4px, -10px); opacity: 0 } }
/* Vacío / asignable: borde punteado que late; silueta y la invitación en oro. */
.post.empty { border-style: dashed; border-color: #6a5f88; background: #221d2e; box-shadow: none; animation: vac 2.4s steps(6) infinite; }
@keyframes vac { 0%, 100% { border-color: #6a5f88 } 50% { border-color: var(--gold) } }
.post.empty .stage { background: repeating-linear-gradient(135deg, #2a2433 0 4px, #262030 4px 8px); box-shadow: inset 0 -6px 0 #3a3044; }
.post.empty .ghost { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); width: 44px; height: 40px; opacity: .35; image-rendering: pixelated; }
.post.empty .name { color: var(--soft); font-size: 12px; }
.post.empty .lv { color: var(--gold); letter-spacing: 0; }
/* Mover: el elegido sube con borde oro; un destino es asignable (punteado oro). */
.post.picked { border-color: var(--gold); transform: translateY(-3px); box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 var(--p4); }
.post.picked .band { background: #8a6a12; color: #fff6c0; }
.post.target { border-style: dashed; border-color: var(--gold); }
/* Grand Master: estrella en la esquina del marco. */
.gm { flex: none; }
/* Eslabón de combinación entre dos nichos vecinos. */
/* Cadena entre vecinos con combinación: dos eslabones que enganchan los dos nichos a la altura del escenario. */
.link { position: absolute; top: 42px; z-index: 2; pointer-events: none; image-rendering: pixelated; }
.collapsed .crew, .collapsed .combos { display: none; }

/* Retratos pequeños (cabecera plegada). */
.mini { width: 26px; height: 26px; display: grid; place-items: center; background: #0c0910; border: 2px solid #5b546d; }
.mini.r1 { border-color: var(--rare); } .mini.r2 { border-color: var(--gold); }
.mini.due { border-color: var(--up); }
.mini.empty { border-style: dashed; border-color: #6a5f88; }
.mini canvas { width: 22px; height: 20px; image-rendering: pixelated; }

/* Columna de estados. */
.states { width: 375px; max-width: 100%; display: flex; flex-direction: column; gap: 14px; }
.states h2 { margin: 6px 0 0; font-family: var(--pixel); font-size: 12px; font-weight: 400; color: var(--gold); }
.states p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.sgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 10px 8px; background: var(--p3); border: 2px solid var(--p4); }
.cap { font-size: 10px; font-weight: 700; color: var(--muted); text-align: center; margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }
.notes2 { display: grid; gap: 8px; }
.notes ul { margin: 0; }
.list { margin: 0; padding-left: 18px; color: #dcd6ea; font-size: 13px; line-height: 1.55; max-width: 62ch; }

/* ---- ROSTER ---- */
.filter { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px; min-height: 40px; padding: 0 5px 2px 10px; }
.filter .sel { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 12px; color: var(--muted); }
.filter .sel b { color: var(--text); font-weight: 800; }
.filter .sel em { font-style: normal; font-family: var(--pixel); font-size: 8px; color: var(--soft); }
.opts { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
.opts .meta { font-size: 9px; }
.opts .row { display: flex; flex-wrap: wrap; gap: 5px; }
.opt { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 9px 2px; font-size: 12px; font-weight: 700; color: var(--soft); background: var(--p2); border: 2px solid var(--p4);
  box-shadow: inset 0 2px 0 var(--p1), inset 0 -3px 0 var(--p3); cursor: pointer; }
.opt.on { border-color: var(--gold); color: var(--text); }
.sep { display: flex; align-items: center; gap: 8px; padding: 4px 2px 0; font-size: 9px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
.sep::after { content: ""; flex: 1; height: 2px; background: var(--p2); }
.rlist { display: flex; flex-direction: column; gap: 6px; }
.mrow { position: relative; display: grid; grid-template-columns: 54px minmax(0, 1fr); align-items: center; column-gap: 9px; min-height: 72px; padding: 5px 7px 6px 5px; cursor: pointer;
  transition: transform .12s steps(2), border-color .2s steps(3), box-shadow .2s steps(3); }
.mrow.press { transform: translateY(1px); }
.mrow.flash { border-color: var(--gold) !important; }
.mrow .pt { position: relative; width: 54px; height: 56px; overflow: hidden; background: var(--zw2, #2a2433); border: 2px solid #5b546d;
  box-shadow: inset 0 -5px 0 #5c3a24, inset 0 -6px 0 #8b5a2b; }
.mrow .pt.r1 { border-color: var(--rare); } .mrow .pt.r2 { border-color: var(--gold); background: radial-gradient(circle at 50% 70%, #ffcf2e30 0 18px, transparent 19px), var(--zw2, #2a2433); }
.mrow .pt canvas.m { position: absolute; left: 50%; bottom: 3px; width: 44px; height: 40px; margin-left: -22px; }
.mrow .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
/* 1: nombre y rendimiento. */
.mrow .l1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.mrow .l1 b { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; line-height: 16px; font-weight: 800; color: var(--text); white-space: nowrap; }
.mrow .l1 .out { font-family: var(--pixel); font-size: 8px; color: var(--text); flex: none; }
/* 2: puesto actual (con su afinidad) o el estado. */
.mrow .l2 { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
.mrow .where { display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 14px; font-weight: 700; color: var(--soft); white-space: nowrap; min-width: 0; overflow: hidden; }
.mrow .where img { height: 12px; width: auto; flex: none; }
.mrow .where .h { display: inline-flex; gap: 1px; }
.mrow .where.none { color: var(--muted); }
.mrow .st { display: inline-flex; align-items: center; gap: 4px; flex: none; font-size: 9px; line-height: 9px; font-weight: 800; letter-spacing: .3px; padding: 3px 5px 4px 4px; white-space: nowrap; }
/* 3: datos secundarios, apagados. */
.mrow .l3 { display: flex; align-items: center; gap: 4px; height: 16px; overflow: hidden; flex-wrap: nowrap; min-width: 0; opacity: .82; }
.mrow .lvl { display: inline-flex; align-items: center; gap: 3px; flex: none; font-size: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; margin-right: 2px; }
.mrow .l1 b .nm2, .mrow .where .wt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .l1 b { min-width: 0; }
/* Rasgos: etiqueta con caja; si no cabe, se corta con puntos suspensivos (nunca salta de línea). */
.tag { display: inline-block; flex: none; min-width: 0; max-width: 150px; height: 16px; line-height: 14px; padding: 0 4px; font-size: 9.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--muted); background: #221d2c; border: 1px solid #352d47; }
.like .lw[hidden] { display: none; }
.tag[hidden] { display: none; }
/* Afinidad: sin caja ni color de rasgo, texto neutro con sus corazones (no se confunde con una manía). */
.like { display: inline-flex; align-items: center; gap: 3px; flex: none; height: 16px; padding: 0 5px 0 1px; font-size: 9.5px; font-weight: 700; color: var(--soft); white-space: nowrap; border-right: 1px solid #3a3248; margin-right: 1px; }
.like .h img { vertical-align: middle; }
.tag.q { color: #ff8a96; border-color: #5a2430; background: #2a171e; }
.tag.j { color: #9cc0f4; border-color: #2b4a7a; background: #182034; }
.tag.l { color: var(--gold); border-color: #7a5e12; background: #2e250e; }
/* Estados: color + icono + texto + forma del borde (no solo color). */
.mrow.due { border-color: #2f6a34; box-shadow: inset 0 0 0 2px var(--up), inset 0 -3px 0 var(--p3); } .mrow.due .st { background: #1f5a28; color: #c8ffc0; }
.mrow.bed { border-color: var(--bed-d); box-shadow: inset 0 0 0 2px var(--bed), inset 0 -3px 0 var(--p3); } .mrow.bed .st { background: #8a2f58; color: #ffe0ec; }
.mrow.train { border-color: var(--train-d); box-shadow: inset 0 0 0 2px var(--train), inset 0 -3px 0 var(--p3); } .mrow.train .st { background: #5a3aa8; color: #efe6ff; }
.mrow.moving { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold), 0 4px 0 var(--p4); transform: translate(-2px, -3px); } .mrow.moving .st { background: #8a6a12; color: #fff6c0; }
.mrow.free { border-style: dashed; border-color: #6a5f88; box-shadow: none; background: #221d2e; } .mrow.free .st { background: transparent; color: var(--soft); border: 1px dashed #8a7fb0; padding: 2px 4px 3px 3px; }
.mrow.free .pt { background: repeating-linear-gradient(135deg, #2a2433 0 4px, #262030 4px 8px); }
.mrow .zz { position: absolute; font-family: var(--pixel); font-size: 8px; color: #bfe8fd; animation: zz 2s steps(4) infinite; }
.crumb { position: absolute; width: 2px; height: 2px; background: #ffcf2e; box-shadow: 0 0 0 1px #2b1d12; }
/* Filtros: abrir y cerrar sin bloquear (rejilla 0fr → 1fr). */
.optwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .16s ease-out; }
.optwrap.open { grid-template-rows: 1fr; }
.optwrap > div { overflow: hidden; min-height: 0; }
.filter .sel em { transition: transform .15s steps(2); }
.filter .sel em.pop { transform: scale(1.25); }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 8px); opacity: 0; padding: 7px 12px 8px; font-size: 12px; font-weight: 700; color: var(--text); background: var(--p2);
  border: 2px solid var(--gold); transition: opacity .15s, transform .15s steps(2); pointer-events: none; white-space: nowrap; z-index: 5; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .mrow, .optwrap, .toast { transition: none !important; } }
/* Lista vacía: un ratón buscando con la lupa, el motivo y una salida. */
.nores { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 12px 12px; text-align: center; }
.nores .scene { position: relative; width: 120px; height: 52px; background: #2a2433; border: 2px solid #5b546d; box-shadow: inset 0 -5px 0 #5c3a24, inset 0 -6px 0 #8b5a2b; overflow: hidden; }
.nores .scene canvas { position: absolute; bottom: 3px; left: 38px; width: 44px; height: 40px; image-rendering: pixelated; animation: nr-walk 4.8s steps(1) infinite; }
.nores .scene .hole { position: absolute; bottom: 5px; width: 10px; height: 8px; background: #15111c; border-radius: 5px 5px 0 0; box-shadow: 0 -2px 0 #3a3044; }
@keyframes nr-walk { 0%, 40% { transform: none } 41%, 80% { transform: scaleX(-1) translateX(6px) } 81%, 100% { transform: none } }
.nores b { font-family: var(--pixel); font-size: 8px; color: var(--text); letter-spacing: .5px; }
.nores p { margin: 0; font-size: 11px; color: var(--muted); max-width: 30ch; }
.nores .act { margin-top: 2px; }

/* ---- FICHA DEL RATÓN (clases fc-) ----
   Una hoja de personaje: arriba el ratón en su nicho, grande y vivo; debajo, lo que hace hoy; luego lo
   que se puede decidir (ascender, tratar, título) y, plegado, lo que es (rasgos, especialidades,
   combinaciones, rango). Mismo kit: caja única, color con función, letra 8/12/16. */
.fc-back { display: flex; align-items: center; justify-content: space-between; height: 30px; flex: none; }
.fc-back .act { height: 30px; padding: 0 10px 2px 8px; }
.fc-back .meta { font-size: 9px; }
/* Héroe: nicho grande con la pared de su roca, el ratón ×4, y la ficha al lado. */
.fc-hero { position: relative; display: grid; grid-template-columns: 136px minmax(0, 1fr); column-gap: 12px; align-items: stretch; padding: 8px 10px 10px 8px; }
.fc-niche { position: relative; width: 136px; height: 122px; cursor: pointer; overflow: hidden; background: var(--zw2, #2a2433); border: 2px solid #5b546d;
  box-shadow: inset 0 2px 0 #0004, inset 0 -9px 0 #5c3a24, inset 0 -11px 0 #8b5a2b; }
.fc-niche.r1 { border-color: var(--rare); box-shadow: inset 0 0 0 2px var(--rare-d), inset 0 -9px 0 #5c3a24, inset 0 -11px 0 #8b5a2b; }
.fc-niche.r2 { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold-d), inset 0 -9px 0 #5c3a24, inset 0 -11px 0 #8b5a2b;
  background: radial-gradient(circle at 50% 66%, #ffcf2e38 0 36px, transparent 37px), var(--zw2, #2a2433); }
.fc-niche.bed { background: linear-gradient(#3a1e2c, #2a1622); border-color: var(--bed); }
.fc-niche.train { background: linear-gradient(#2a2244, #1e1834); border-color: var(--train); }
.fc-niche canvas.m { position: absolute; left: 13px; bottom: 9px; width: 110px; height: 100px; }
.fc-niche .bricks { position: absolute; inset: 0 0 11px; background: repeating-linear-gradient(0deg, transparent 0 13px, #0002 13px 14px), repeating-linear-gradient(90deg, transparent 0 27px, #0001 27px 28px); pointer-events: none; }
.fc-niche .shadow { position: absolute; left: 36px; bottom: 9px; width: 70px; height: 5px; background: #0005; }
.fc-niche .zz { font-size: 12px; }
.fc-niche .spark { width: 4px; height: 4px; }
.fc-id { display: flex; flex-direction: column; gap: 7px; min-width: 0; padding-top: 2px; }
.fc-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.fc-name b { font-family: var(--pixel); font-size: 12px; line-height: 14px; font-weight: 400; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fc-who { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--soft); white-space: nowrap; }
.fc-who .rar { font-size: 10px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
.fc-who .rar.r1 { color: var(--rare); } .fc-who .rar.r2 { color: var(--gold); }
.fc-lv { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-top: auto; }
.fc-lv b { font-family: var(--pixel); font-size: 16px; line-height: 16px; font-weight: 400; color: var(--text); }
.fc-lv b small { font-size: 8px; color: var(--muted); margin-right: 4px; }
.fc-lv span { font-size: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.fc-lv b .lvn { display: inline-block; font-size: 16px; font-weight: 400; color: var(--text); }
.fc-xp { height: 8px; background: #141020; border: 2px solid var(--p4); box-shadow: inset 0 1px 0 #0008; }
.fc-xp i { display: block; height: 100%; background: #5a9cf0; box-shadow: inset 0 1px 0 #a8ccff, inset 0 -1px 0 #2b5cab; }
/* Trabajo de hoy. */
.fc-job { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 10px; min-height: 56px; padding: 7px 8px 9px 10px; }
.fc-job .t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fc-job .k { font-size: 9px; font-weight: 800; letter-spacing: .5px; color: var(--muted); }
.fc-job .p { display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 16px; font-weight: 800; color: var(--text); white-space: nowrap; }
.fc-job .p img { height: 14px; width: auto; }
.fc-job .r { font-size: 11px; line-height: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fc-job .x { font-family: var(--pixel); font-size: 8px; color: var(--text); }
.fc-job.none { border-style: dashed; border-color: #6a5f88; background: #221d2e; box-shadow: none; }
.fc-job.none .p { color: var(--soft); }
.fc-job .act.go { background: #ff8a2e; color: #fff; text-shadow: 1px 1px 0 #7a2a10; border-color: #2b1d12; box-shadow: inset 0 2px 0 #ffe0a0, inset 0 -3px 0 #d9581f; }
/* Afinidad: seis oficios, dos casillas de corazón cada uno (vacía = no le gusta). */
.fc-aff { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.fc-aff i { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 6px; font-style: normal; background: var(--p3); border: 2px solid var(--p2); }
.fc-aff i img { height: 14px; width: auto; }
.fc-aff i em { font-style: normal; font-size: 9px; line-height: 9px; font-weight: 800; letter-spacing: .3px; color: var(--muted); }
.hh { display: inline-flex; align-items: center; gap: 1px; }
.fc-aff i .hh { display: flex; gap: 1px; height: 8px; }
.fc-aff i.a1 em, .fc-aff i.a2 em { color: var(--soft); }
.fc-aff i.here { background: #2f2840; border-color: #8a7fb0; }
.fc-aff i.here::before { content: ""; position: absolute; top: -6px; left: 50%; margin-left: -4px; border: 4px solid transparent; border-top-color: #8a7fb0; }
.fc-legend { display: flex; justify-content: center; gap: 14px; margin-top: -6px; font-size: 9px; line-height: 10px; color: var(--muted); opacity: .85; }
.fc-legend span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
/* Ascenso (verde = ascender). */
.fc-promo { display: flex; flex-direction: column; gap: 8px; padding: 8px 10px 10px; border-color: #2f6a34; box-shadow: inset 0 0 0 2px var(--up), inset 0 -3px 0 var(--p3); }
.fc-promo.short, .fc-promo.wait { border-color: var(--p4); box-shadow: inset 0 2px 0 var(--p1), inset 0 -3px 0 var(--p3); }
.fc-ph { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fc-ph b { display: inline-flex; align-items: center; gap: 6px; font-family: var(--pixel); font-size: 8px; line-height: 8px; font-weight: 400; color: var(--up); }
.fc-promo.short .fc-ph b, .fc-promo.wait .fc-ph b { color: var(--soft); }
.fc-ph small { font-size: 10px; font-weight: 700; color: var(--muted); }
.fc-pstage { display: grid; grid-template-columns: 1fr 28px 1fr; align-items: center; gap: 4px; }
.fc-pfig { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.fc-pfig .st { position: relative; width: 100%; height: 56px; background: #241f2e; box-shadow: inset 0 -5px 0 #5c3a24, inset 0 -6px 0 #8b5a2b; }
.fc-pfig .st canvas { position: absolute; left: 50%; bottom: 4px; width: 44px; height: 40px; margin-left: -22px; }
.fc-pfig.to .st { background: radial-gradient(circle at 50% 70%, #62d36e26 0 24px, transparent 25px), #241f2e; }
.fc-pfig figcaption { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
.fc-pfig.to figcaption { color: var(--text); }
.fc-parrow { display: grid; place-items: center; }
.fc-gains { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.fc-gains li { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 15px; color: var(--soft); }
.fc-gains li::before { content: ""; flex: none; width: 4px; height: 4px; margin-top: 6px; background: var(--up); }
.fc-gains b { color: var(--up); font-size: 10px; letter-spacing: .4px; }
.fc-go { display: flex; align-items: center; justify-content: center; gap: 10px; height: 40px; padding: 0 10px 3px; font-family: var(--pixel); font-size: 8px; color: #fff; cursor: pointer;
  background: #ff8a2e; text-shadow: 1px 1px 0 #7a2a10; border: 2px solid #2b1d12; box-shadow: inset 0 2px 0 #ffe0a0, inset 0 -4px 0 #d9581f;
  clip-path: polygon(2px 0, calc(100% - 2px) 0, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 0 calc(100% - 2px), 0 2px); }
.fc-go:active { transform: translateY(1px); }
.fc-go span { display: inline-flex; align-items: center; gap: 4px; padding-left: 10px; border-left: 2px solid #c9561c; }
.fc-go img { width: 14px; height: 14px; }
.fc-go.off { background: var(--p1); color: var(--muted); text-shadow: none; border-color: var(--p4); box-shadow: inset 0 2px 0 #54486c, inset 0 -3px 0 var(--p3); cursor: default; }
.fc-go.off span { border-left-color: var(--p3); }
.fc-go.off img { filter: grayscale(1) brightness(.8); }
.fc-wait { display: flex; flex-direction: column; gap: 6px; }
.fc-wait .bar { height: 8px; background: #141020; border: 2px solid var(--p4); }
.fc-wait .bar i { display: block; height: 100%; background: #5a9cf0; }
.fc-wait small { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); white-space: nowrap; }
/* Cuidado en la casa: rosa la cama, violeta el entrenamiento. */
.fc-care { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 8px 10px 10px; }
.fc-care.bed { border-color: var(--bed-d); box-shadow: inset 0 0 0 2px var(--bed), inset 0 -3px 0 var(--p3); }
.fc-care.train { border-color: var(--train-d); box-shadow: inset 0 0 0 2px var(--train), inset 0 -3px 0 var(--p3); }
.fc-care .h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fc-care .h b { display: inline-flex; align-items: center; gap: 6px; font-family: var(--pixel); font-size: 8px; font-weight: 400; }
.fc-care.bed .h b { color: var(--bed); } .fc-care.train .h b { color: var(--train); }
.fc-care .h small { font-size: 11px; font-weight: 700; color: var(--soft); }
.fc-care p { margin: 0; font-size: 12px; line-height: 15px; color: var(--soft); }
.fc-care .bar { height: 8px; background: #141020; border: 2px solid var(--p4); }
.fc-care.bed .bar i { display: block; height: 100%; background: var(--bed); }
.fc-care.train .bar i { display: block; height: 100%; background: var(--train); }
.fc-care .q { display: inline-block; padding: 0 4px; font-weight: 800; color: #9cc0f4; border: 1px dashed #2b4a7a; }
/* Grand Master (oro = título). */
.fc-gm { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 10px; padding: 8px 8px 10px 10px; }
.fc-gm .t { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fc-gm b { display: inline-flex; align-items: center; gap: 6px; font-family: var(--pixel); font-size: 8px; font-weight: 400; color: var(--soft); }
.fc-gm small { font-size: 11px; line-height: 14px; color: var(--muted); }
.fc-gm.on { border-color: var(--gold-d); box-shadow: inset 0 0 0 2px var(--gold), inset 0 -3px 0 var(--p3); background: #2e2614; }
.fc-gm.on b { color: var(--gold); }
.fc-gm .warn { color: #ff9a8a; }
.fc-gm .act { height: auto; min-height: 30px; padding: 5px 8px 6px; line-height: 11px; text-align: center; }
/* Secciones plegables. */
.fc-sec { padding: 0; }
.fc-sh { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; height: 40px; padding: 0 6px 2px 10px; cursor: pointer; }
.fc-sh .t { display: flex; align-items: center; gap: 8px; }
.fc-sh .t b { font-family: var(--pixel); font-size: 8px; font-weight: 400; color: var(--text); }
.fc-sh .t i { font-style: normal; min-width: 18px; height: 16px; display: grid; place-items: center; padding: 0 4px 1px; font-size: 10px; font-weight: 800; color: var(--soft); background: var(--p3); border: 1px solid var(--p1); }
.fc-sh .t .sub { font-size: 11px; font-weight: 700; color: var(--muted); }
.fc-sh .act { height: 26px; }
.fc-sb { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .16s ease-out; }
.fc-sec.open .fc-sb { grid-template-rows: 1fr; }
.fc-sb > div { overflow: hidden; min-height: 0; }
.fc-sb > div > div { display: flex; flex-direction: column; gap: 6px; padding: 0 8px 10px; }
.fc-hint { margin: 2px 2px 0; font-size: 11px; line-height: 15px; color: var(--muted); }
/* Un rasgo por línea: marca de tipo, nombre, qué hace y, si toca, su acción. */
.fc-tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px; min-height: 40px; padding: 5px 6px 6px 8px; background: var(--p3); border-left: 3px solid #4a4260; }
.fc-tr .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fc-tr .t b { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; line-height: 15px; font-weight: 800; color: var(--text); }
.fc-tr .t span { font-size: 11px; line-height: 14px; color: var(--muted); }
.fc-tr .bad { color: #ff8a96; }
.fc-tr.q { border-left-color: #c94a5a; } .fc-tr.q .t b { color: #ff8a96; }
.fc-tr.j { border-left-color: var(--rare); } .fc-tr.j .t b { color: #9cc0f4; }
.fc-tr.l { border-left-color: var(--gold); background: #2a2312; } .fc-tr.l .t b { color: var(--gold); }
.fc-tr .gr { font-size: 9px; font-weight: 800; letter-spacing: .4px; padding: 1px 4px 2px; color: #9cc0f4; border: 1px solid #2b4a7a; }
.fc-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 94px; min-height: 34px; padding: 3px 4px 5px; cursor: pointer;
  background: var(--p1); border: 2px solid var(--p4); box-shadow: inset 0 2px 0 #54486c, inset 0 -3px 0 var(--p3);
  clip-path: polygon(2px 0, calc(100% - 2px) 0, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 0 calc(100% - 2px), 0 2px); }
.fc-btn b { font-family: var(--pixel); font-size: 8px; font-weight: 400; color: var(--text); white-space: nowrap; }
.fc-btn small { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 800; color: var(--gold); white-space: nowrap; }
.fc-btn small img { width: 10px; height: 10px; }
.fc-btn.bed { border-color: var(--bed-d); box-shadow: inset 0 0 0 2px #8a2f58, inset 0 -3px 0 var(--p3); }
.fc-btn.bed b { color: var(--bed); }
.fc-btn.train { border-color: var(--train-d); box-shadow: inset 0 0 0 2px #5a3aa8, inset 0 -3px 0 var(--p3); }
.fc-btn.train b { color: var(--train); }
.fc-btn.on { cursor: default; }
.fc-btn.on small { color: var(--soft); }
.fc-btn.busy { cursor: default; background: var(--p2); box-shadow: none; border-style: dashed; border-color: #5b546d; }
.fc-btn.busy b, .fc-btn.busy small { color: var(--muted); }
.fc-btn.short small { color: var(--muted); } .fc-btn.short small img { filter: grayscale(1) brightness(.8); }
/* Especialidad: oficio con su grado, barra de trabajos y RETRAIN aparte. */
.fc-sp { display: flex; flex-direction: column; gap: 6px; padding: 7px 8px 8px; background: var(--p3); border-left: 3px solid var(--rare); }
.fc-sp.none { border-left-color: #4a4260; }
.fc-sp .h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fc-sp .h b { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--soft); }
.fc-sp .h b img { height: 12px; width: auto; }
.fc-sp .n { font-size: 13px; font-weight: 800; color: #9cc0f4; }
.fc-sp .d { font-size: 11px; line-height: 14px; color: var(--muted); }
.fc-sp .d u { text-decoration: none; color: var(--text); font-weight: 800; }
.fc-sp .bar { height: 6px; background: #141020; border: 1px solid var(--p4); }
.fc-sp .bar i { display: block; height: 100%; background: var(--rare); }
.fc-sp .foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px; }
.fc-sp .foot small { font-size: 10px; line-height: 13px; color: var(--muted); }
/* Combinaciones del ratón (oro = premio). */

function mouseEl(m, cls = '') {
  const frames = [mouseCanvas(m, 0), mouseCanvas(m, 1), mouseCanvas(m, 0, true)];
  const c = document.createElement('canvas'); c.width = 22; c.height = 20; c.className = cls;
  c.getContext('2d').drawImage(frames[0], 0, 0);
  // Fotogramas de gesto bajo demanda, guardados por clave: cada variante se dibuja una sola vez.
  const cache = {};

  anims.push({ c, m, frames, get, off: Math.random() * 3000 });

}

// Silueta blanca (transformación del ascenso).
function whiteOf(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; const x = c.getContext('2d');
  x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fffbe8'; x.fillRect(0, 0, c.width, c.height); return c;
}
// Píxeles de efecto: cuadrados que saltan y caen (confeti, polvo, astillas). Duran lo que duran y se borran solos.
function burst(layer, x, y, n, colors, { spread = 34, up = 30, size = 4, dur = 700, fall = 18 } = {}) {
  if (reduced) return;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i'); p.className = 'fc-px'; p.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${colors[i % colors.length]}`;
    layer.appendChild(p);
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.5, r = spread * (0.6 + Math.random() * 0.5);
    const dx = Math.round(Math.cos(a) * r / 2) * 2, dy = Math.round((Math.sin(a) * r - up * Math.random()) / 2) * 2;
    p.animate([{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${dx}px,${dy}px)`, opacity: 1, offset: 0.55 }, { transform: `translate(${dx}px,${dy + fall}px)`, opacity: 0 }], { duration: dur + Math.random() * 200, easing: 'steps(8)' });
    setTimeout(() => p.remove(), dur + 260);
  }
}
function floatText(layer, x, y, html, cls = 'fc-bang', dur = 900, rise = 14) {
  const t = document.createElement('span'); t.className = cls; t.style.left = x + 'px'; t.style.top = y + 'px'; t.innerHTML = html; layer.appendChild(t);
  t.animate([{ transform: 'translateY(4px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1, offset: 0.15 }, { transform: 'translateY(0)', opacity: 1, offset: 0.7 }, { transform: `translateY(-${rise}px)`, opacity: 0 }], { duration: dur, easing: 'steps(6)' });
  setTimeout(() => t.remove(), dur); return t;
}
function toast(html, cls = '') {
  const sh = document.querySelector('.sheet'); const t = document.createElement('div'); t.className = 'fc-toast ' + cls; t.innerHTML = html; sh.appendChild(t);
  t.animate([{ opacity: 0, transform: 'translate(-50%, -6px)' }, { opacity: 1, transform: 'translate(-50%, 0)', offset: 0.12 }, { opacity: 1, transform: 'translate(-50%, 0)', offset: 0.85 }, { opacity: 0, transform: 'translate(-50%, -6px)' }], { duration: 1900, easing: 'steps(6)' });
  setTimeout(() => t.remove(), 1900);
}

// ---------- El retrato: su propio animador ----------
// Capas: base (respira, parpadeo al azar con doble parpadeo a veces), micro (oreja, cola), acto (gesto de su
// carácter o de su estado, o una reacción) y estado (cama, entrenamiento, sin puesto, ascenso pendiente).
// Píxel a píxel: el lienzo va a ×5 y cada desplazamiento es un múltiplo de 5 px.
const S5 = 5;
function makeHero(m, canvas, niche, nfx, hfx) {
  const H = { m, c: canvas, niche, nfx, hfx, state: '', act: null, cache: {}, off: Math.random() * 2000 };
  H.kind = m.kind || 'look';
  H.tempo = 640; H.nextBlink = 0; H.blinkEnd = 0; H.nextMicro = 0; H.micro = null; H.nextAct = performance.now() + 2200;
  H.get = (dy, blink, o) => { const k = dy + (blink ? 'b' : '') + JSON.stringify(o); return (H.cache[k] ||= mouseCanvas(H.m, dy, blink, o)); };
  H.setMouse = (m2) => { H.m = m2; H.cache = {}; H.key = ''; };
  H.play = (name, extra = {}) => { const A = ACTS[name]; if (!A) return; H.act = { name, t0: performance.now(), dur: A.dur, ...extra }; if (A.start) A.start(H); };
  H.update = (t) => {
    // Siguiente gesto cuando no hay ninguno en marcha.
    if (H.act && t - H.act.t0 > H.act.dur) H.act = null;
    if (!H.act && t > H.nextAct && !H.hold) {
      const st = H.state;
      const pick = H.m.gm && !st && Math.random() < 0.3 ? 'pride' : st === 'due' ? (Math.random() < 0.55 ? 'cheer' : H.kind) : st === 'train' ? (Math.random() < 0.7 ? 'page' : 'aha') : st === 'free' ? (Math.random() < 0.6 ? 'tap' : 'look') : st === 'bed' ? 'dream' : Math.random() < 0.7 ? H.kind : 'look';
      H.play(pick);
      H.nextAct = t + (st === 'train' ? 2400 : 4200) + Math.random() * 4000;
    }
    const ph = t + H.off;
    let dy = Math.floor(ph / H.tempo) % 2, blink = false;
    if (t > H.nextBlink) { H.blinkEnd = t + 110; H.double = Math.random() < 0.25; H.nextBlink = t + 1800 + Math.random() * 3200; }
    if (t < H.blinkEnd || (H.double && t > H.blinkEnd + 120 && t < H.blinkEnd + 220)) blink = true;
    if (t > H.nextMicro) { H.micro = { k: Math.random() < 0.5 ? 'ear' : 'tail', until: t + (Math.random() < 0.5 ? 170 : 420) }; H.nextMicro = t + 2000 + Math.random() * 5000; }
    const o = {}; let tx = 0, ty = 0, flip = false, white = false, face = '';
    if (H.micro && t < H.micro.until) { if (H.micro.k === 'ear') o.ear = 1; else if (Math.floor((H.micro.until - t) / 140) % 2) o.tail = 1; }
    // Estado de fondo.
    if (H.state === 'bed') { dy = Math.floor(ph / 1500) % 2; face = 'sleep'; delete o.tail; }
    if (H.state === 'train') { o.book = 1; face = 'down'; }
    // Acto en marcha.
    const F = { dy, blink, o, tx, ty, flip, white, face };
    if (H.act) ACTS[H.act.name].frame(t - H.act.t0, F, H);
    if (F.face) F.o.face = F.face;
    if (!F.o.ear) delete F.o.ear;
    const key = F.dy + '|' + F.blink + '|' + JSON.stringify(F.o) + '|' + F.white + '|' + (H.m.rank) + H.m.name;
    if (key !== H.key) {
      H.key = key; let fr = H.get(F.dy, F.blink, F.o); if (F.white) fr = whiteOf(fr);
      const x = H.c.getContext('2d'); x.clearRect(0, 0, 22, 20); x.drawImage(fr, 0, 0);
    }
    const tr = `translate(${F.tx * S5}px, ${F.ty * S5}px)` + (F.flip ? ' scaleX(-1)' : '') + (F.sq ? ` scale(${F.sq[0]}, ${F.sq[1]})` : '');
    if (tr !== H.tr) { H.tr = tr; H.c.style.transform = tr; H.c.style.transformOrigin = '50% 100%'; }
  };
  return H;
}

const ROCKS6 = [
  { id: 'cheddar', name: 'Cheddar', note: 'Canto rodado redondo: la roca aprobada de hoy (c0 y v5).', w: 54, h: 42, real: true, crest: [16, 36] },
  { id: 'gouda', name: 'Gouda', note: 'Losas apiladas, ancha y baja, con vetas de cera roja entre losa y losa.', w: 60, h: 34, mat: ['#2a3038', '#4e5866', '#76808e', '#a2acb8', '#d8dee6'], shape: (x, y, w, h) => { const band = Math.floor(y / 9); const inset = [8, 4, 1, 0][Math.min(3, band)]; return x >= inset && x < w - inset - (band === 0 ? 4 : 0); }, crest: [12, 44], cheese: 'cheese', seams: '#c0392b' },
  { id: 'brie', name: 'Brie', note: 'Montículo blando y achatado, con costra de moho blanco que se desborda un poco.', w: 56, h: 36, mat: ['#4a4438', '#8a8270', '#c8c0a8', '#e8e2d0', '#ffffff'], shape: (x, y, w, h) => { const t = Math.abs((x + 0.5 - w / 2) / (w / 2)), u = Math.max(0, t - 0.4) / 0.6; return y >= h * (0.16 + 0.8 * u * u); }, crest: [17, 39], cheese: 'cream', rind: true },
  { id: 'emmental', name: 'Emmental', note: 'Roca de lomo ancho con ojos (cavidades); la veta se abre en el centro.', w: 56, h: 42, mat: ['#4a4020', '#8a7a40', '#c8b060', '#e8d48a', '#fff4c0'], shape: (x, y, w, h) => ((x + 0.5 - w / 2) / (w / 2)) ** 4 + ((y + 0.5 - h) / h) ** 2 <= 1, crest: [17, 39], cheese: 'cheese', holes: [[11, 20, 4.2], [44, 30, 3.4], [16, 35, 2.4]] },
  { id: 'parmesan', name: 'Parmesano', note: 'Bloque facetado y granuloso, más alto, con brillos de cristal y una meseta arriba.', w: 50, h: 46, mat: ['#3e3020', '#7a6040', '#b8986a', '#dcc094', '#fff0c8'], shape: (x, y, w, h) => inPoly(x + 0.5, y + 0.5, [[3, h], [0, 26], [7, 9], [15, 2], [35, 2], [44, 11], [50, 28], [w, h]]), crest: [16, 34], cheese: 'aged', grain: true },
  { id: 'blue', name: 'Blue', note: 'Pizarra oscura con vetas minerales azules; los costados en sierra y la cresta llana.', w: 54, h: 44, mat: ['#14182a', '#262c46', '#3a4466', '#56648c', '#8a9ac0'], shape: (x, y, w, h) => { const c = x >= 17 && x <= 37, top = c ? 8 : 9 + Math.abs(((x * 7) % 14) - 7) * 0.7 + ((x + 0.5 - w / 2) / (w / 2)) ** 2 * 22; return y >= top; }, crest: [17, 37], cheese: 'cheese', veins: '#5ab0ff' },
];
// Luz de arriba a la izquierda, como la roca aprobada: tono por posición y canto superior iluminado.
function rockProposal(r, open) {
  if (r.real) return im(open ? ROCKV[4] : ROCKC[0]);
  return art('rp' + r.id + open, () => {
    MAT['rp' + r.id] = r.mat; const p = Px(r.w, r.h), inS = (x, y) => x >= 0 && y >= 0 && x < r.w && y < r.h && r.shape(x, y, r.w, r.h);
    p.fn('rp' + r.id, (x, y) => inS(x, y), 0, 0, r.w, r.h, { shade: 'flat' });
    for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) { if (!inS(x, y)) continue; const d = (x / r.w) * 0.55 + (y / r.h) * 0.75 + (hash4(x, y, 7) - 0.5) * 0.1; p.tone(x, y, !inS(x, y - 1) ? 4 : d < 0.38 ? 3 : d < 0.82 ? 2 : 1); if (!inS(x + 1, y) || !inS(x, y + 1)) p.tone(x, y, 1); }
    for (let i = 0; i < 6; i++) { const x = 6 + Math.floor(hash4(i, r.w) * (r.w - 12)), y = 8 + Math.floor(hash4(i, r.h) * (r.h - 12)); bres(x, y, x + 3 - (i % 3) * 2, y + 5, (a, b) => inS(a, b) && inS(a, b - 2) && p.tone(a, b, 0)); }
    if (r.seams) for (let y = 9; y < r.h; y += 9) for (let x = 0; x < r.w; x++) if (inS(x, y)) p.px(x, y, r.seams);
    if (r.rind) for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) if (inS(x, y) && (!inS(x, y - 1) || (!inS(x, y - 2) && hash4(x, y, 3) < 0.6))) p.px(x, y, '#ffffff');
    if (r.grain) for (let i = 0; i < 46; i++) { const x = Math.floor(hash4(i, 9) * r.w), y = Math.floor(hash4(i, 11) * r.h); if (inS(x, y) && inS(x, y - 1)) p.px(x, y, hash4(i, 5) < 0.3 ? '#fffbe8' : '#8a6c48'); }
    if (r.veins) for (let i = 0; i < 4; i++) bres(8 + i * 11, r.h - 3, 14 + i * 9, 16 + (i % 2) * 6, (a, b) => { if (inS(a, b) && inS(a, b - 1)) p.px(a, b, r.veins); });
    if (r.holes) for (const [cx, cy, rr] of r.holes) for (let y = -5; y <= 5; y++) for (let x = -5; x <= 5; x++) { const q = (x * x + y * y) / (rr * rr); if (q < 1 && inS(cx + x, cy + y)) p.px(cx + x, cy + y, y > rr * 0.4 ? '#7a6a30' : '#2a2010'); else if (q < 1.45 && y < 0 && inS(cx + x, cy + y)) p.px(cx + x, cy + y, MAT['rp' + r.id][1]); }
    if (open) { const cx = Math.round(r.w / 2), cy = r.h - 14; for (let y = -7; y <= 7; y++) for (let x = -11; x <= 11; x++) if ((x / 11) ** 2 + (y / 7) ** 2 <= 1) { const inner = (x / 9) ** 2 + ((y - 1) / 5.5) ** 2 <= 1; p.px(cx + x, cy + y, inner ? (y < -2 ? '#2a1a10' : MAT[r.cheese][y > 2 ? 2 : 3]) : '#1b1220'); } }
    return p.render();
  });
}

// ---------- SIMULACIÓN ESPEJO (V4.1) ----------
// Copia, para Cheddar, de las reglas reales de js/game/systems/production.js y js/game/simulation.js. Lo que cambia son las
// cifras: son de ejemplo (rotuladas en la columna) para que el ciclo entero se vea en menos de un minuto. No toca el juego.
//  · MINE: solo se pica sin veta a la vista (status 'ready'); con veta, picar falla ('vein-exposed').
//  · Golpe a mano: combo si llega antes de 650 ms; crítico cada 5 del combo. Con un minero en la roca, cada toque hace al menos
//    el 4 % de la búsqueda (12 % si es crítico). Sin minero, la fuerza del pico (x3 en crítico).
//  · El minero da un golpe cada «intervalo» solo mientras la roca está 'ready'; con veta a la vista, su acumulador vuelve a 0.
//  · Al completar la búsqueda: la veta se abre con toda su capacidad y el combo vuelve a 0.
//  · DRILL: solo arranca con veta y sin ciclo en marcha; al arrancar reserva su Raw de la veta y lo entrega al acabar. Tocar con
//    un ciclo en marcha lo acelera 250 ms. Con perforador, encadena ciclos mientras haya veta.
//  · Veta vacía al acabar un ciclo: la veta se cierra, la búsqueda vuelve a 0 y la roca baja un nivel de profundidad.
//  · REFINE, CHEESE y SELL: arrancan si tienen material (lo gastan al arrancar) y entregan al acabar; tocar acelera.
const RULE = { help: 0.04, helpCrit: 0.12, critEvery: 5, critMult: 3, comboMs: 650, drillBoostMs: 250, refBoostMs: 250, cookBoostMs: 250, sellBoostMs: 300 };
// Cifras de ejemplo (no son las del juego): búsqueda en unidades, ritmos en ms.
const EX = { need: 60, pick: 2, minerPower: 4, minerMs: 1400, capacity: 32, drillYield: 4, drillMs: 2000, rawPerBase: 2, refBatch: 2, refMs: 3000, cookBase: 1, cookMs: 3500, sellLots: 1, sellMs: 2600 };
const P41 = { miner: true, driller: true, refiner: true, cook: true, keeper: true };
let Z41, EVL = [];
function simReset(o = {}) {
  Z41 = { depth: DEP.cheddar, discover: 0, veinRevealed: false, veinRemaining: 0, drillJob: null, refJob: null, cookJob: null, sellJob: null, minerAcc: 0, combo: 0, lastHitAt: -1e9, raw: 4, base: 3, lots: 2, coins: 0, hits: 0, ...o };
}
simReset();
const emit41 = (type, d = {}) => { const e = { type, t: performance.now(), ...d }; EVL.push(e); if (EVL.length > 400) EVL.shift(); for (const f of EVH) f(e); };
const EVH = [];
const on41 = (f) => EVH.push(f);
const fail41 = (reason) => ({ ok: false, reason });
const veinNeed = () => EX.need;
const SIM41 = {
  mineStatus: () => (Z41.veinRevealed ? 'vein-exposed' : 'ready'),
  // Golpe: 'manual' (el jugador) o 'worker' (el minero). Misma regla que CM.mining.hit.
  hit(source) {
    if (this.mineStatus() !== 'ready') return fail41('vein-exposed');
    const need = veinNeed(), now = performance.now(); let crit = false;
    if (source === 'manual') { Z41.combo = now - Z41.lastHitAt <= RULE.comboMs ? Z41.combo + 1 : 1; Z41.lastHitAt = now; crit = Z41.combo % RULE.critEvery === 0; }
    let power = source === 'manual' ? EX.pick * (crit ? RULE.critMult : 1) : EX.minerPower;
    if (source === 'manual' && P41.miner) power = Math.max(power, need * (crit ? RULE.helpCrit : RULE.help));
    const amount = Math.min(need - Z41.discover, power); Z41.discover += amount; Z41.hits++;

// Reglas del propietario: proporciones de MICE (cuerpo compacto y redondo, cabeza grande, orejas y hocico propios), nada de
// girar, estirar o deformar el sprite de pie; mejor pequeño y acurrucado que estirado; la cama y la manta se adaptan al ratón.
// Cómo están hechas: la cabeza es la oficial (filas 0–5 de BODY) con la cara oficial «sleep», tal cual; el cuerpo se dibuja a
// mano para cada pose con las mismas letras de paleta (pelo g/G/D, barriga w/s, patas f/F, cola T) y el mismo volumen que el
// torso y las patas oficiales, recogido. Sombrero y bufanda salen de las mismas reglas que mouseCanvas; la mochila se quita
// (se cuelga en la cama). Contorno: el de los ratones (pal.o), por fuera de la silueta.

// ---------- Comprobación de todo el bucle, fotograma a fotograma (cada 16 ms) ----------
// Pinta por separado el ratón, la manta, el pie y el cabecero, y cuenta: manta encima del ratón sin estar tapándolo; ratón
// encima de la manta mientras lo tapa; cambios de capa con la manta tocando al ratón; ratón dentro del pie o del cabecero;
// ratón en el aire fuera de los saltos y de los saltitos; sprites que no son los aprobados o no van a escala 1; y el mayor
// salto entre dos fotogramas seguidos.
function checkBedLoop(m, bx, by, W, H) {
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingEnabled = false; return [c, x]; };
  const mask = (draw) => { const [c, x] = mk(); draw(x); const d = x.getImageData(0, 0, W, H).data, out = new Uint8Array(W * H); for (let i = 0; i < W * H; i++) out[i] = d[i * 4 + 3] > 127 ? 1 : 0; return out; };
  const and = (a, b) => { let n = 0; for (let i = 0; i < a.length; i++) if (a[i] && b[i]) n++; return n; };
  const bedOnly = mask((x) => x.drawImage(bed3(), bx, by)), foot = new Uint8Array(W * H), head = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; if (!bedOnly[i]) continue; if (x <= bx + 4 && y < by + 14) foot[i] = 1; if (x >= bx + 41 && y < by + 14) head[i] = 1; } // la madera del pie y del cabecero, sin su contorno
  const APPROVED = new Set(['oficial', 'oficial sin mochila', 'acurrucado', 'acurrucado (ojos abiertos)']);
  const r = { frames: 0, overBlanketWrong: 0, underBlanketWrong: 0, layerSwitchTouching: 0, footHits: 0, headHits: 0, floating: 0, notApproved: 0, maxJump: 0, maxJumpAt: 0, switches: [] };
  let prev = null, prevLayer = null, prevAnchor = null;
  for (let t = 0; t < BT.end; t += 16) {
    const f = bedFrame(t, m, bx, by); r.frames++;
    if (!f.mouse) { prevAnchor = null; prevLayer = f.blanket.layer; continue; }
    if (!APPROVED.has(f.mouse.key) || !(f.mouse.cv.width === 22 || f.mouse.cv.width === poseCanvas(m, 'A').width)) r.notApproved++;
    const mm = mask((x) => drawMouseB(x, f.mouse)), bm = mask((x) => drawBlanketB(x, bx, by, f.blanket, f.csx, f.csy, m)), ov = and(mm, bm);
    const covering = f.blanket.cover > 0;
    if (f.blanket.layer === 'above' && ov && !covering) r.overBlanketWrong++;
    if (f.blanket.layer === 'below' && ov && covering) r.underBlanketWrong++;
    if (prevLayer && prevLayer !== f.blanket.layer) { r.switches.push(t); if (ov) r.layerSwitchTouching++; }
    prevLayer = f.blanket.layer;
    if (and(mm, foot)) r.footHits++; if (and(mm, head)) r.headHits++;
    // Apoyo: la fila más baja del ratón toca el colchón (o se hunde 1 px, acurrucado) o el suelo, salvo en los saltos.
    let bottom = -1, minx = W, maxx = 0; for (let i = 0; i < mm.length; i++) if (mm[i]) { const y = (i / W) | 0, x = i % W; bottom = Math.max(bottom, y); minx = Math.min(minx, x); maxx = Math.max(maxx, x); }
    const onBed = minx > bx + 4 && maxx < bx + 41, surf = onBed ? by + 14 : by + 22;
    if (!f.air && !(bottom === surf - 1 || bottom === surf)) r.floating++;
    const anchor = [(minx + maxx) / 2, bottom];
    if (prevAnchor) { const j = Math.hypot(anchor[0] - prevAnchor[0], anchor[1] - prevAnchor[1]); if (j > r.maxJump) { r.maxJump = j; r.maxJumpAt = t; } }
    prevAnchor = anchor;

}
