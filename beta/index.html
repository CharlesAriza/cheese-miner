<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1622" />
    <!-- Cheese Driller Beta: MAIN 3.0 sobre el núcleo real (core/). Guarda en su propia clave; no lee ni toca partidas anteriores.
         Se publica con tools/deploy-beta.sh, que resuelve las rutas. -->
    <title>Cheese Driller Beta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <link rel="stylesheet" href="p0.css?v=ac4c1dd" />
    <link rel="stylesheet" href="beta.css?v=ac4c1dd" />
  </head>
  <body>
    <div id="p0">
      <main class="p0-scene" id="scene-box">
        <canvas id="cv"></canvas>
        <div id="plates"></div>
        <header class="hud">
          <button class="hud-coins bx" id="hud-coinsbox" aria-label="Resources" aria-expanded="false">
            <img class="pix" src="assets/main2/out/sprites/ic_coin.png" alt="" />
            <span><b id="hud-coins">0</b><small id="hud-rate">+0/min</small></span>
            <i class="dd-well" aria-hidden="true"></i>
          </button>
          <button class="hud-depth bx" id="hud-depthbox" aria-label="Depth">
            <span class="hd-txt"><b id="hud-depth">DEPTH 0</b><em id="hud-tier">CHEDDAR</em></span>
            <i class="hd-bar"><i id="hud-depthbar"></i></i>
            <img class="pix hd-ic" id="hud-tieric" alt="" />
          </button>
        </header>
        <div class="pop res-pop bx" id="res-pop" hidden></div>
        <button class="goal bx" id="goal" hidden><img class="pix" id="goal-ic" alt="" /><span class="goal-tx"><b id="goal-t"></b><i class="goal-bar"><i id="goal-bar"></i></i></span><em id="goal-n"></em></button>
        <div class="perf-meter" id="perf-meter" hidden></div>
        <!-- Volver a la mina: solo cuando la cámara está lejos de su sitio o sigue a un ratón. -->
        <button class="home-btn bx" id="home-btn" aria-label="Back to the mine" hidden><img class="pix hb-ar" data-ic="ret" alt="" /><span>MINE</span></button>
        <div id="p0-toast"></div>
      </main>
      <div class="pop crew-pop bx" id="crew-pop" hidden></div>
      <section class="panel bx" id="panel">
        <button class="pn-st bx sunk" id="pn-st" aria-label="Station panel"><img class="pix" id="pn-ic" alt="" /><i class="bo-chip" id="pn-bo" aria-hidden="true"><i></i><i></i></i></button>
        <button class="pn-act bx" id="pn-act"><b id="pn-actb">DIG</b><small id="pn-acts">Tap</small></button>
        <div class="pn-info">
          <div class="pn-name"><b id="pn-name">MINE</b><small id="pn-lv">LV 1</small><small class="pn-bot" id="pn-bot"></small></div>
          <small class="pn-status" id="pn-status">Searching</small>
          <small class="pn-flow" id="pn-flow">Depth 0</small>
          <i class="pn-bar"><i id="pn-bar"></i></i>
        </div>
        <button class="pn-crew bx sunk" id="pn-crew" aria-expanded="false"><b id="pn-crewn">0/0</b><small>WORKERS</small><i class="dd-well up" aria-hidden="true"></i></button>
      </section>
      <nav class="nav">
        <button class="bx" data-nav="mice" id="nav-mice"><img class="pix" data-ic="mouse" alt="" /><span>MICE</span></button>
        <button class="bx" data-nav="upgrades" id="nav-upgrades"><img class="pix" data-ic="bars" alt="" /><span>UPGRADES</span></button>
        <button class="bx" data-nav="boosts" id="nav-boosts"><img class="pix" data-ic="bolt" alt="" /><span>BOOSTS</span></button>
        <button class="bx" data-nav="menu" id="nav-menu"><img class="pix" data-ic="menu" alt="" /><span>MENU</span></button>
      </nav>
      <div class="p0-sheet" id="sheet" hidden><div class="p0-sheetbox bx"><header><b id="sheet-title"></b><button class="bx" id="sheet-close">CLOSE</button></header><div id="sheet-body"></div></div></div>
      <!-- Calculando la ausencia, o cuando la partida no se ha podido leer. -->
      <div class="bt-cover" id="bt-cover" hidden><div class="bt-card bx" id="bt-card"></div></div>
    </div>
    <script>window.CM = {}; window.BETA_ROOT = ''; window.BETA_BUILD = 'ac4c1dd';</script>
    <script src="js/game/config/balance.js?v=ac4c1dd"></script>
    <script src="js/game/config/traits.js?v=ac4c1dd"></script>
    <script src="core/data/baseline.js?v=ac4c1dd"></script>
    <script src="core/data/roadmap.js?v=ac4c1dd"></script>
    <script src="core/crew.js?v=ac4c1dd"></script>
    <script src="core/effects.js?v=ac4c1dd"></script>
    <script src="core/products.js?v=ac4c1dd"></script>
    <script src="core/model.js?v=ac4c1dd"></script>
    <script src="core/inventory.js?v=ac4c1dd"></script>
    <script src="core/rules.js?v=ac4c1dd"></script>
    <script src="core/lab.js?v=ac4c1dd"></script>
    <script src="core/progression.js?v=ac4c1dd"></script>
    <script src="core/game.js?v=ac4c1dd"></script>
    <script src="core/save.js?v=ac4c1dd"></script>
    <script src="art.js?v=ac4c1dd"></script>
    <script src="drag.js?v=ac4c1dd"></script>
    <script src="beta.js?v=ac4c1dd"></script>
  </body>
</html>
